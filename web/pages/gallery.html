</head>
<body data-page="gallery">
  <header class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="../index.html">首頁</a> / 畫面</div>
      <h1>畫面圖庫</h1>
      <p>官方主視覺。遊戲實機畫面暫不公開。</p>
    </div>
  </header>

  <section class="band band--ink" id="promo">
    <div class="container">
      <div class="sec-head">
        <p class="sec-kicker" style="color:var(--gold)">Key Visual</p>
        <h2 class="sec-title">官方主視覺</h2>
        <p class="sec-lead">遊戲實機畫面暫不公開。</p>
      </div>

      <!-- 官方主視覺大圖展示 -->
      <div style="margin-bottom:2.2rem;border-radius:20px;overflow:hidden;border:3px solid rgba(212,175,55,0.5);box-shadow:0 10px 30px rgba(0,0,0,0.5)">
        <img src="../media/hero/key_visual_greece_gears.png" alt="發條之心主視覺 · 希臘神殿石柱與黃金齒輪" style="width:100%;height:auto;display:block" />
        <div style="background:var(--warm);padding:1rem 1.25rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.75rem">
          <div>
            <strong style="color:var(--gold);font-size:1.15rem;display:block">《發條之心》官方主視覺 · 希臘神殿與黃金齒輪</strong>
            <span style="color:rgba(255,255,255,0.8);font-size:0.9rem">懸浮發條之心反應爐 · 白兔、獅子、狐狸、野豬全金屬發條公仔小隊</span>
          </div>
          <a class="btn btn-primary" href="../media/hero/key_visual_greece_gears.png" target="_blank" style="padding:0.5rem 1rem;font-size:0.9rem">查看高解析原圖</a>
        </div>
      </div>
    </div>
  </section>

  <div class="lb" id="lb" hidden>
    <button type="button" class="lb-close" id="lb-close" aria-label="關閉">×</button>
    <img id="lb-img" alt="" />
  </div>

  <style>
    .lb {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(20, 16, 22, 0.9);
      display: grid; place-items: center;
      padding: 1.5rem;
      cursor: zoom-out;
    }
    .lb[hidden] { display: none !important; }
    .lb img {
      max-width: min(1100px, 100%);
      max-height: 88vh;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .lb-close {
      position: absolute; top: 1rem; right: 1rem;
      width: 44px; height: 44px; border: 0; border-radius: 50%;
      background: rgba(255,255,255,0.15); color: #fff;
      font-size: 1.5rem; cursor: pointer;
    }
    .lb-close:hover { background: rgba(255,255,255,0.28); }
  </style>

  <script src="../js/site.js"></script>
  <script>
    (function () {
      var lb = document.getElementById("lb");
      var lbImg = document.getElementById("lb-img");
      function openLb(src) {
        lbImg.src = src;
        lb.hidden = false;
      }
      function closeLb() {
        lb.hidden = true;
        lbImg.src = "";
      }
      document.body.addEventListener("click", function (e) {
        var t = e.target.closest("[data-full]");
        if (t) {
          e.preventDefault();
          openLb(t.getAttribute("data-full"));
        }
      });
      document.getElementById("lb-close").addEventListener("click", closeLb);
      lb.addEventListener("click", function (e) {
        if (e.target === lb) closeLb();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeLb();
      });
    })();
  </script>
</body>
</html>
